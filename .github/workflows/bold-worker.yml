# Publica el Worker que firma los pagos de Bold (bold/worker.js) en Cloudflare.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOLD_SECRET_KEY, BOLD_API_KEY
# Las llaves de Bold quedan como secretos del Worker; nunca se escriben en el código ni en la página.
name: Worker de pagos Bold
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bold/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secretos
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S: ${{ secrets.BOLD_SECRET_KEY }}
        run: |
          if [ -z "$T" ] || [ -z "$S" ]; then echo "::notice::Faltan secretos de Cloudflare/Bold; no se publica el Worker."; echo "skip=1" >> "$GITHUB_ENV"; fi
      - name: Publicar en Cloudflare
        if: env.skip != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bold
          secrets: |
            BOLD_SECRET_KEY
            BOLD_API_KEY
        env:
          BOLD_SECRET_KEY: ${{ secrets.BOLD_SECRET_KEY }}
          BOLD_API_KEY: ${{ secrets.BOLD_API_KEY }}
