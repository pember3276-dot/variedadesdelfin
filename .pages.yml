# Panel de productos (Pages CMS: https://app.pagescms.org).
# Cada producto es un archivo en datos/productos/. El Action "Catálogo" actualiza la web al guardar.
media:
  input: img/subidas
  output: /img/subidas
  extensions: [jpg, jpeg, png, webp, mp4, mov, webm, m4v, 3gp]

content:
  - name: productos
    label: Productos
    description: Aquí agregas, cambias o quitas productos de la tienda. Al guardar, la página se actualiza sola en unos minutos.
    type: collection
    path: datos/productos
    format: json
    filename: "{fields.nombre}.json"
    view:
      primary: nombre
      fields: [nombre, precio, publicado, destacado]
      search: [nombre]
      sort: [creado, nombre, precio]
      default:
        sort: creado
        order: desc
    fields:
      - name: nombre
        label: Nombre
        description: Así se verá el producto en la tienda.
        type: string
        required: true
      - name: fotos
        label: Fotos y videos (la primera foto sale en la tienda)
        description: Toca para subir desde la galería del celular. Hasta 10 archivos.
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, mp4, mov, webm, m4v, 3gp]
          multiple:
            max: 10
      - name: videos
        label: Más videos (opcional; también puedes subirlos arriba)
        type: file
        options:
          extensions: [mp4, mov, webm, m4v, 3gp]
          multiple: true
      - name: precio
        label: Precio (pesos, sin puntos)
        description: Ejemplo 25000 para $25.000.
        type: number
        required: true
        options:
          min: 0
      - name: categoria
        label: Categoría
        description: Sección de la tienda donde aparece.
        type: select
        default: misc
        options:
          values:
            - { name: gifts, label: Regalos y detalles }
            - { name: stationery, label: Papelería }
            - { name: sweets, label: Dulcería }
            - { name: plush, label: Peluches }
            - { name: season, label: Temporada }
            - { name: toys, label: Juguetes }
            - { name: tech, label: Tecnología }
            - { name: home, label: Hogar y cocina }
            - { name: tools, label: Herramientas }
            - { name: care, label: Cuidado personal }
            - { name: misc, label: Variedades }
      - name: descripcion
        label: Descripción
        description: Cuenta para qué sirve, medidas, colores o lo que el cliente necesite saber.
        type: text
      - name: publicado
        label: Mostrar en la tienda
        description: Apágalo para esconder el producto sin borrarlo (por ejemplo, si se agotó).
        type: boolean
        default: true
      - name: destacado
        label: Destacado (sale de primero)
        type: boolean
        default: false
      - name: precio_antes
        label: Precio antes (opcional, sale tachado como oferta)
        type: number
        options:
          min: 0
      - name: caracteristicas
        label: Detalles (opcional)
        description: Un detalle por renglón, por ejemplo Incluye pilas.
        type: string
        list: true
      # Campos internos: no se muestran en el panel, pero se conservan.
      - { name: id, type: string, hidden: true }
      - { name: creado, type: string, hidden: true }
      - { name: nombre_en, type: string, hidden: true }
      - { name: descripcion_en, type: text, hidden: true }
      - { name: caracteristicas_en, type: string, list: true, hidden: true }
