# Panel de productos (Pages CMS: https://app.pagescms.org).
# Lo que se guarda aquí va a datos/productos.json; el Action "Catálogo" actualiza la web.
media:
  input: img/subidas
  output: /img/subidas
  extensions: [jpg, jpeg, png, webp]

content:
  - name: productos
    label: Productos
    type: file
    path: datos/productos.json
    format: json
    list: true
    fields:
      - name: id
        label: Código
        type: string
        hidden: true
      - name: publicado
        label: Publicado en la web
        type: boolean
        default: false
        description: Déjalo apagado mientras revisas. Actívalo cuando el precio y la descripción estén listos.
      - name: nombre
        label: Nombre del producto
        type: string
        required: true
      - name: foto
        label: Foto
        type: image
        description: Toma la foto con fondo claro. La web la recorta y la optimiza sola.
      - name: precio
        label: Tu precio de venta (pesos)
        type: number
        options:
          min: 0
        description: Lo que paga el cliente. Escríbelo sin puntos, por ejemplo 45000.
      - name: precio_antes
        label: Precio antes (opcional, sale tachado)
        type: number
        options:
          min: 0
        description: Si lo llenas con un valor mayor, el producto sale como Oferta flash con el descuento.
      - name: categoria
        label: Categoría
        type: select
        default: misc
        options:
          values:
            - { name: gifts, label: Regalos y detalles }
            - { name: stationery, label: Papelería }
            - { name: sweets, label: Dulcería }
            - { name: plush, label: Peluches }
            - { name: season, label: Temporada }
            - { name: toys, label: Juguetes }
            - { name: tech, label: Tecnología }
            - { name: home, label: Hogar y cocina }
            - { name: tools, label: Herramientas }
            - { name: care, label: Cuidado personal }
            - { name: misc, label: Variedades }
      - name: descripcion
        label: Descripción corta
        type: text
        description: Si la dejas vacía y hay foto, se escribe sola en 1 o 2 minutos. Puedes corregirla.
      - name: caracteristicas
        label: Características
        type: string
        list: true
      - name: pedir_sugerencia
        label: Sugerir descripción y precio con IA
        type: boolean
        default: true
        description: Al guardar, mira la foto, busca precios en tiendas de Colombia y llena la descripción y el precio de referencia. Se apaga sola cuando termina.
      - name: sugerencia
        label: Sugerencia de precio (solo referencia)
        type: object
        readonly: true
        fields:
          - name: precio_referencia
            label: Precio de referencia en la web (pesos)
            type: number
          - name: fuentes
            label: Dónde se encontró
            type: string
            list: true
          - name: nota
            label: Nota
            type: text
      - name: nombre_en
        label: Nombre en inglés (opcional)
        type: string
      - name: descripcion_en
        label: Descripción en inglés (opcional)
        type: text
      - name: caracteristicas_en
        label: Características en inglés (opcional)
        type: string
        list: true
